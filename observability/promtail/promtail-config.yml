# Tails bug-triage-service's stdout (one JSON line per pipeline stage, see
# PrometheusTelemetryRecorder.logStage) via Docker service discovery and
# ships it to Loki. report_hash and stage are lifted out as structured
# metadata (indexed, queryable, but not part of the label set) so a single
# report's flow can be correlated across stages without the label
# cardinality blowup a report-per-series label set would cause (ticket #42).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: triage-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["bug-triage-service"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - target_label: job
        replacement: triage-service
    pipeline_stages:
      - json:
          expressions:
            level: level
            stage: stage
            report_hash: report_hash
            ts: time
      - timestamp:
          source: ts
          format: UnixMs
      - structured_metadata:
          report_hash:
          stage:
      - labels:
          level:
