# Provisioned datasources (ticket #42) — no manual "Add data source" click
# needed on a fresh `docker compose up`. UIDs are pinned so the dashboard
# JSON and its cross-datasource data links can reference them by id.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
