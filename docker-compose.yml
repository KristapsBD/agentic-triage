services:
  gitea:
    image: gitea/gitea:1.24
    container_name: bug-triage-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
    restart: unless-stopped
    volumes:
      - gitea-data:/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  triage-service:
    build:
      context: ./service
    container_name: bug-triage-service
    env_file:
      - .env
    environment:
      # Override the host-facing GITEA_URL from .env with the in-network address.
      - GITEA_URL=http://gitea:3000
      - DECISION_DB_PATH=/data/decisions.sqlite3
    volumes:
      - ./service:/app
      - /app/node_modules
      - triage-decisions:/data
    ports:
      - "8000:8000"
    depends_on:
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  gitea-data:
  triage-decisions:
